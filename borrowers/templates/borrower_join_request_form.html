{% extends 'borrower_base.html' %}
{% block content %}
<div class="container mt-4">
  <h3>Join {{ group.name }}</h3>
  <p class="text-muted">Please tell us a bit more about your interest in joining this group.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit Request</button>
  </form>
</div>
{% endblock %}
