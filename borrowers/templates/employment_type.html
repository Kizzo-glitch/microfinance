{% extends 'borrower_base.html' %}
{% load static %}

{% block content %}



<div class="container mt-5"> 
    <div class="row justify-content-center"> 
        <div class="col-md-6 col-lg-5"> 
            <div class="card shadow-sm p-4"> 
                <h2 class="card-title text-center mb-4">How do you earn a living?</h2>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        
                        <label for="{{ form.employment_type.id_for_label }}" class="form-label">
                            Note: The default is retrieved from your Profile
                        </label>
                        
                        {{ form.employment_type }}

                        {% if form.employment_type.errors %}
                            <div class="invalid-feedback d-block">
                                {% for error in form.employment_type.errors %}
                                    {{ error }}
                                {% endfor %}
                            </div>
                        {% endif %}
                    </div>


                    <div class="d-grid gap-2"> 
                        <button type="submit" class="btn btn-primary btn-lg mt-3">Next</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

    {{ form.as_p }}

{% endblock %}
