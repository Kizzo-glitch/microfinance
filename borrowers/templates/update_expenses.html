{% extends 'borrower_base.html' %}

{% block content %}

	<div class="container mt-5">
	  <h4>Expenses for {{ employment_type|title }} | Your Monthly Net Income: {{ income }}</h4>
	 
	  <form method="post">
	    {% csrf_token %}
	    {% for field in form %}
	      <div class="mb-3">
	        <label class="form-label">{{ field.label }}</label>
	        {{ field }}
	        {% if field.errors %}
	          <div class="text-danger">{{ field.errors }}</div>
	        {% endif %}
	      </div>
	    {% endfor %}
	    <button type="submit" name="action" value="save_continue" class="btn btn-primary">
        Save & Continue
	    </button>
	    <button type="submit" name="action" value="save_exit" class="btn btn-secondary">
	        Save & Exit
	    </button>
	    <!--<button type="submit" class="btn btn-primary">Save Expenses</button>-->
	  </form>

	</div>



{% endblock %}
