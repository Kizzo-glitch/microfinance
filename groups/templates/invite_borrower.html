{% extends 'group_dash_base.html' %}
{% block content %}


<div class="container py-4">
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <h4 class="fw-bold text-success mb-3">Invite Borrower to {{ group.name }}</h4>
      <form method="post">
  {% csrf_token %}
  
  <!-- Group Invitation Form -->
  <div class="card mb-4">
    <div class="card-header bg-light fw-bold">Invitation Details</div>
    <div class="card-body">
      {{ form.as_p }}
    </div>
  </div>

  <!-- Borrower Profile Form -->
  <div id="borrower-profile-section" class="card">
    <div class="card-header bg-light fw-bold">Borrower Profile (for new invitees)</div>
    <div class="card-body">
      {{ profile_form.as_p }}
    </div>
  </div>

  <div class="text-end mt-3">
    <button type="submit" class="btn btn-success">Send Invitation</button>
    <a href="{% url 'groups:group_detail' group.id %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>

<script>
  document.addEventListener("DOMContentLoaded", function () {
      const inviteeSelect = document.getElementById("invitee-select");
      const profileSection = document.getElementById("borrower-profile-section");

      async function checkBorrowerProfile(userId) {
          if (!userId) {
              profileSection.style.display = "block";
              return;
          }

          const response = await fetch(`/groups/api/borrowers/has_profile/${userId}/`);
          const data = await response.json();

          if (data.has_profile) {
              profileSection.style.display = "none";
          } else {
              profileSection.style.display = "block";
          }
      }

      inviteeSelect.addEventListener("change", function () {
          checkBorrowerProfile(this.value);
      });
  });
</script>
