{% extends 'lender_base.html' %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Personnel Management</h4>
        <a href="{% url 'compliance:compliance_detail' lender.id %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in personnel_list %}
                    <tr>
                        <td>{{ p.full_name }}</td>
                        <td>{{ p.get_role_display }}</td>
                        <td>
                             <span class="badge bg-{{ p.status.class }}">{{ p.status.label }}</span>
                        </td>
                        <td>
                            <a href="{% url 'compliance:personnel_update' p.pk %}" class="btn btn-sm btn-primary">Edit</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">No personnel records found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
