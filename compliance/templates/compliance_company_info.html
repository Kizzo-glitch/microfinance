{% extends "lender_base.html" %}
{% block content %}

<div class="container mt-4">
  <h4>Company Information</h4>

  <form method="post">
    {% csrf_token %}

    {{ form.company_name.label_tag }}
    {{ form.company_name }}

    {{ form.proposed_capital.label_tag }}
    {{ form.proposed_capital }}

    {{ form.capital_source.label_tag }}
    {{ form.capital_source }}

    <button type="submit" class="btn btn-success mt-3">
      Continue →
    </button>
  </form>
</div>

{% endblock %}
