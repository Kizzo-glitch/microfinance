{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

  <h4>Governance Setup</h4>

  <form method="post">
    {% csrf_token %}

    <div class="form-check">
      {{ form.has_internal_audit_committee }}
      <label class="form-check-label">Internal Audit Committee</label>
    </div>

    <div class="form-check">
      {{ form.has_board_credit_committee }}
      <label class="form-check-label">Board Credit Committee</label>
    </div>

    <div class="form-check">
      {{ form.has_finance_manager }}
      <label class="form-check-label">Finance Manager Appointed</label>
    </div>

    <button type="submit" class="btn btn-success mt-3">
      Continue →
    </button>
  </form>

</div>

{% endblock %}
